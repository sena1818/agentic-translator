# 翻译系统配置文件

# API 配置
api:
  provider: "siliconflow"  # siliconflow, openai, google
  base_url: "https://api.siliconflow.cn/v1"
  model: "deepseek-ai/DeepSeek-V3"

  # LLM 参数
  translator:
    temperature: 0.3  # 翻译创造性
    max_retries: 3

  checker:
    temperature: 0.1  # 质检确定性

# 并发控制
concurrency:
  max_concurrent_requests: 10
  batch_size: 5
  rate_limit_per_minute: 200
  request_timeout: 60

# 文本分块
text_splitting:
  chunk_size: 3600
  target_chunk_size: 3200
  min_chunk_size: 1200
  chunk_overlap: 200
  context_window: 1400
  separators: ["\n\n", "\n", ".", "!", "?", " ", ""]

# 路径配置 (相对于项目根目录)
paths:
  input: "data/input"
  output: "data/output"
  temp: "data/temp"
  glossaries: "data/glossaries"
  logs: "logs"
  artifact_rules: "config/artifact_rules.yaml"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - [%(levelname)s] - %(message)s"

# Web 服务配置
server:
  port: 8000
  reload: false
  reload_dirs:
    - "src"
    - "frontend"
    - "run_server.py"
    - "run_worker.py"

# 结构化翻译（Document IR，见 ADR-0004）
# 启用后以 pandoc AST 持有文档结构，LLM 只翻译带内联标签的段；
# 公式、链接地址、图片、脚注、代码由程序保证不丢不错位，并导出段级双语对照与联动 HTML。
# 需要安装 pandoc；不可用时自动回落到传统 Markdown 分块。
document_ir:
  enabled: true
  # 参考文献类章节（Works Cited / Bibliography / 参考文献……）保留原文，标题照常翻译
  keep_bibliography: true

# 翻译质量控制
quality:
  max_fix_attempts: 1
  enable_qa_check: true
  untranslated_word_span: 12
  max_glossary_checks: 25
  # 理论著作中概念靠首字母大写标记：Earth/Solid 等术语不约束文中小写的普通用法。
  # 论文类文本请设为 false（见 config/research_paper.yaml）
  glossary_respect_case: true
  qa_checks:
    - "terminology"  # 术语一致性
    - "untranslated"  # 未翻译检测
    - "format"  # 格式保留
  # 语义质检：否定、情态强弱、数字角色、漏译/增译（issue #20）。结论是提示，只报告不触发修复。
  semantic_check:
    enabled: false          # 关闭时行为与未接入时一致
    use_model: false        # false 只跑确定性启发式（不花 token）；true 另用模型逐段检查
    high_risk_only: true    # 模型只查含否定/情态/数字/长句的段
    batch_size: 12          # 每次调用送检的段数
    # 优先使用与翻译员不同来源的模型；留空则复用 checker 模型
    model: null
    base_url: null
    api_key_env: null       # 存放该模型密钥的环境变量名

# 语义检索（issue #24）：审校页搜索框与 MCP 工具 search_book_by_meaning 按意思找原话。
# 段级关键词（BM25）+ 向量混合排序；未配置向量模型时为仅关键词排序，并在结果中提示。
semantic_search:
  embedder: none            # none | openai（OpenAI 兼容 /v1/embeddings）| local（本机 transformers，仅读本地缓存）
  model: null               # openai 例：BAAI/bge-m3（多语言）；local 例：BAAI/bge-small-en-v1.5（仅英文）
  base_url: null            # openai 兼容服务地址，如 https://api.siliconflow.cn/v1
  api_key_env: null         # 存放密钥的环境变量名
  languages: null           # 模型能处理的语言；默认 openai 为 [en, zh]，local 为 [en]
  batch_size: 32

# Worker 队列配置
worker:
  inline_enabled: true
  poll_interval_seconds: 2
  stale_after_seconds: 900
  max_parallel_tasks: 1
  processes: 1

# 可观测性（Langfuse）
observability:
  langfuse:
    enabled: false  # 开关；默认关闭。开启且具备密钥才接入，缺 SDK/密钥自动降级为无操作
    # 密钥从环境变量读取，不写入本文件：
    #   LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST（可选，默认云版）

# Prompt 领域定制（可选）：不配置时使用通用专业文本人设。
# 各字段覆盖默认角色与要求，完整示例见 config/research_paper.yaml。
# prompt:
#   translator_role: "你是资深的机器学习论文译者……"
#   translation_requirements:
#     - "……"
#   repair_requirements:
#     - "……"
#   analyst_requirements:
#     - "terminology_hints 最多 {max_term_hints} 条"

# 术语表引导生成（translate.py --suggest-glossary）
glossary_extraction:
  max_chars: 16000   # 采样文档前 N 字符供术语专家扫描
  max_terms: 60      # 最多起草多少候选术语

# 三角色多 agent 协作
multi_agent:
  enabled: true
  engine: "langgraph"  # 编排引擎：langgraph | native（见 ADR-0001）
  analyst_temperature: 0.1
  analyst_max_chars: 12000
  analyst_max_sections: 12
  analyst_max_term_hints: 12
  # 术语账本：翻译前统一全书反复出现的专名与自造概念译名（分批的额外调用），见 src/pipelines/glossary/term_ledger.py
  term_ledger:
    enabled: true
    sources: [proper, keyness, structure]  # 专名 / 关键度（小写自造概念词）/ 强调·引号·标题
    max_proper: 120           # 专名一路：按次数取前 N 条（与旧做法相同）
    max_keyness: 80           # 关键度一路：专名之外最多补 N 条
    max_structure: 40         # 结构一路：前两路之外最多补 N 条
    max_terms: 240            # 合并后的总上限
    contexts: 3               # 每个候选附全书中差异较大的上下文数；有歧义的多给一处
    batch_size: 60            # 每次模型调用定多少条
    defer_ambiguous: false    # true：有歧义的候选不进账本，留给术语 agent（#18）
